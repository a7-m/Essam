<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - منصة الأستاذ عصام</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css"> <!-- Parent uses similar layout -->
</head>
<body class="bg-secondary">
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">الأستاذ عصام</div>
            <nav class="sidebar-nav">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><span>📊</span> لوحة التحكم</a></li>
                <li class="nav-item"><a href="student-results.html" class="nav-link"><span>🏆</span> نتائج الطلاب</a></li>
                <li class="nav-item"><a href="profile.html" class="nav-link active"><span>👤</span> الملف الشخصي</a></li>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-block" onclick="authService.signOut()">🚪 تسجيل الخروج</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>الملف الشخصي</h1>
                    <p class="text-secondary">تعديل بياناتك الشخصية</p>
                </div>
            </header>

            <div class="card p-4" style="max-width: 600px; margin: 0 auto;">
                <form id="profile-form">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" name="full_name" id="full_name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني (لا يمكن تغييره)</label>
                        <input type="email" id="email" class="form-control" disabled>
                    </div>

                    <div class="form-group">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="text" name="phone" id="phone" class="form-control">
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary btn-block">حفظ التغييرات</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/utils/errors.js"></script>
    <script src="../js/utils/validation.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/theme.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/services/auth.service.js"></script>

    <script>
        async function initProfile() {
            try {
                const user = await authService.requireRole('parent', '../login.html');
                if (!user) return;

                document.getElementById('full_name').value = user.profile.full_name;
                document.getElementById('email').value = user.email;
                document.getElementById('phone').value = user.profile.phone || '';

                document.getElementById('profile-form').addEventListener('submit', handleUpdateProfile);
            } catch (error) {
                handleError(error, 'initProfile');
            }
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const updates = Object.fromEntries(formData.entries());

            try {
                await authService.updateProfile({
                    full_name: updates.full_name,
                    phone: updates.phone
                });
                showToast('تم تحديث الملف الشخصي بنجاح', 'success');
            } catch (error) {
                handleError(error, 'handleUpdateProfile');
            }
        }

        document.addEventListener('DOMContentLoaded', initProfile);
    </script>
</body>
</html>
