<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - منصة الأستاذ عصام</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--primary) 0%, var(--primary-dark) 100%);
            padding: var(--spacing-md);
        }
        
        .auth-card {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-header h1 {
            font-size: var(--font-size-2xl);
            color: var(--primary);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-header p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }
        
        .auth-links {
            text-align: center;
            margin-top: var(--spacing-lg);
        }
        
        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-links a:hover {
            text-decoration: underline;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="navbar-brand">
                <img src="assets/images/شعار الموقع.png" alt="شعار الأستاذ عصام عبدالمنعم">
            </a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>استعادة كلمة المرور</h1>
                <p>أدخل بريدك الإلكتروني لتلقي رابط إرسال كلمة المرور</p>
            </div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                    إرسال رابط الاستعادة
                </button>
            </form>
            
            <div class="auth-links">
                <a href="login.html">العودة لتسجيل الدخول</a>
            </div>
            
            <footer class="mt-4 text-center">
                <p class="text-secondary" style="font-size: 0.9rem;">
                    &copy; 2026 أحــمـد عـصــام ـــ منصة الأستاذ عصام عبدالمنعم التعليمية. جميع الحقوق محفوظة.
                </p>
            </footer>
        </div>
    </div>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils/errors.js"></script>
    <script src="js/utils/validation.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/theme.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/services/auth.service.js"></script>
    
    <script>
        const form = document.getElementById('forgotPasswordForm');
        const submitBtn = document.getElementById('submitBtn');
        
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                
                if (!email) return;
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'جارٍ الإرسال...';
                
                try {
                    await authService.resetPassword(email);
                    // AuthService handles the toast success message
                    form.reset();
                    submitBtn.textContent = 'تم الإرسال بنجاح';
                } catch (error) {
                    console.error(error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'إرسال رابط الاستعادة';
                }
            });
        }
    </script>
</body>
</html>
